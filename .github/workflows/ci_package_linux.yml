name: Build Linux Package

on:
  push:
    branches: [ master, main, dev ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armhf]
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64,arm

    - name: Install dependencies for ${{ matrix.arch }}
      run: |
        if [ "${{ matrix.arch }}" = "amd64" ]; then
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libmodbus-dev
        else
          # Pour cross-compilation
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config crossbuild-essential-${{ matrix.arch }}
          
          # Installation de libmodbus pour l'architecture cible
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y libmodbus-dev:arm64
          elif [ "${{ matrix.arch }}" = "armhf" ]; then
            sudo apt-get install -y libmodbus-dev:armhf
          fi
        fi

    - name: Configure CMake for ${{ matrix.arch }}
      run: |
        if [ "${{ matrix.arch }}" = "amd64" ]; then
          cmake -B build -DCMAKE_BUILD_TYPE=Release
        elif [ "${{ matrix.arch }}" = "arm64" ]; then
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
        elif [ "${{ matrix.arch }}" = "armhf" ]; then
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++
        fi

    - name: Build
      run: cmake --build build --config Release

    - name: Run tests
      if: matrix.arch == 'amd64'
      run: ctest --test-dir build --build-config Release --output-on-failure

    - name: Check binary
      if: matrix.arch == 'amd64'
      run: |
        ./build/bin/mbpoll -V
        ./build/bin/mbpoll -h || true

    - name: Build Debian package
      run: |
        cd build
        cpack -G DEB

    - name: Get package info
      id: pkg
      run: |
        shopt -s nullglob
        deb_files=(build/*.deb)
        if [ ${#deb_files[@]} -eq 0 ]; then
          echo "Error: no .deb package found in build/ directory" >&2
          exit 1
        fi
        DEB_FILE="${deb_files[0]}"
        VERSION=$(dpkg-deb -f "$DEB_FILE" Version)
        echo "DEB_FILE=$DEB_FILE" >> "$GITHUB_OUTPUT"
        echo "DEB_NAME=mbpoll_${VERSION}_linux_${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
        dpkg-deb --info "$DEB_FILE"
        echo "---"
        dpkg-deb --contents "$DEB_FILE"

    - name: Upload Debian package artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.pkg.outputs.DEB_NAME }}
        path: build/*.deb

    - name: Check tag is on master or main
      if: startsWith(github.ref, 'refs/tags/v')
      id: check_branch
      run: |
        BRANCHES=$(git branch -r --contains $GITHUB_SHA)
        if echo "$BRANCHES" | grep -qE 'origin/master|origin/main'; then
          echo "ON_MAIN=true" >> $GITHUB_OUTPUT
        else
          echo "Tag is not on master/main, skipping release"
          echo "ON_MAIN=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/v') && steps.check_branch.outputs.ON_MAIN == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: build/*.deb
        generate_release_notes: true
        draft: false
        prerelease: false
